# Keep background expiration out of committed fixtures used by regression suites.
# Expiration integration tests explicitly enable the job and invoke it deterministically.
booking.expiration-enabled=false
# Keep cached test contexts from reserving production-sized idle pools.
# Eight connections cover holder + two workers + lock observer in concurrency tests.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=0
