name: badminton_court_management

services:
  postgres:
    image: postgres:15-alpine
    container_name: bcm-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: badminton_court_db
      POSTGRES_USER: bcm_admin
      POSTGRES_PASSWORD: "12345"
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      # Host 5433: native PostgreSQL trên Windows đã chiếm 5432,
      # application.yml mặc định trỏ localhost:5433
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./db/migration.sql
        target: /docker-entrypoint-initdb.d/01-init.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./db/upgrades/booking-ux-upgrade.sql
        target: /docker-entrypoint-initdb.d/02-booking-ux-upgrade.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./db/seeds/branches-seed.sql
        target: /docker-entrypoint-initdb.d/03-branches-seed.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./db/upgrades/product-promotions-upgrade.sql
        target: /docker-entrypoint-initdb.d/06-product-promotions-upgrade.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./db/upgrades/court-promotions-upgrade.sql
        target: /docker-entrypoint-initdb.d/07-court-promotions-upgrade.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./db/demo-seed.sql
        target: /docker-entrypoint-initdb.d/08-demo-seed.sql
        read_only: true
        bind:
          create_host_path: false

      - type: bind
        source: ./db/upgrades/email-identity-upgrade.sql
        target: /docker-entrypoint-initdb.d/09-email-identity-upgrade.sql
        read_only: true
        bind:
          create_host_path: false

    healthcheck:
      # The temporary init server accepts Unix sockets before seed completion.
      # TCP is available only after all init scripts finish successfully.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bcm_admin -d badminton_court_db"]
      interval: 10s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: bcm-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      # Pin JVM local zone to the business zone so any code still using the
      # default zone (logging, ad-hoc LocalDateTime.now()) matches the app clock.
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/badminton_court_db
      SPRING_DATASOURCE_USERNAME: bcm_admin
      SPRING_DATASOURCE_PASSWORD: "12345"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      BOOKING_PAYMENT_ENABLED_METHODS: VNPAY
      BCM_SEED_ENABLED: "false"
      BOOKING_HOLD_DURATION: ${BOOKING_HOLD_DURATION:-PT10M}
      BOOKING_VNPAY_PAYMENT_URL: ${BOOKING_VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      BOOKING_VNPAY_TMN_CODE: ${BOOKING_VNPAY_TMN_CODE:-}
      BOOKING_VNPAY_HASH_SECRET: ${BOOKING_VNPAY_HASH_SECRET:-}
      BOOKING_VNPAY_RETURN_URL: ${BOOKING_VNPAY_RETURN_URL:-}
      BOOKING_PAYMENT_FRONTEND_RESULT_URL: ${BOOKING_PAYMENT_FRONTEND_RESULT_URL:-http://localhost:5174/payment-result}

    ports:
      - "8080:8080"


  web-admin:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        WEB_DIR: web-admin
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  web-user:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        WEB_DIR: web-app
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    name: badminton_court_management_postgres_data
